<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Student Rewards Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 520px;
      margin: 15px auto;
      background: white;
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #188038;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      display: none;
    }

    .info {
      display: block !important;
      background: #eef3fd;
      border: 2px solid #4285f4;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      border: 2px solid #d93025;
    }

    .barcode {
      font-size: 32px;
      font-weight: bold;
      margin-top: 12px;
      word-break: break-all;
    }

    .tip {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>🏆 Student Rewards</h1>

  <div class="subtitle">
    Badge Scanner Test
  </div>

  <button
    id="scanButton"
    type="button">
    📷 START BADGE SCANNER
  </button>

  <div id="reader"></div>

  <div id="status"></div>

  <div class="tip">
    Hold the badge horizontally if needed.<br>
    Make sure the entire barcode is visible.<br>
    Move the phone slowly closer and farther away.
  </div>

</div>


<script>

let scanner = null;
let locked = false;


window.addEventListener("load", function () {

  document
    .getElementById("scanButton")
    .addEventListener("click", startScanner);

});


async function startScanner() {

  const button =
    document.getElementById("scanButton");

  locked = false;

  button.disabled = true;
  button.innerHTML = "STARTING CAMERA...";

  showStatus(
    "Starting camera...",
    "info"
  );


  try {

    // Ask Safari for camera permission first.

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    stream
      .getTracks()
      .forEach(function (track) {
        track.stop();
      });


    scanner =
      new Html5Qrcode("reader");


    /*
      IMPORTANT:
      We are NOT restricting barcode formats
      in this version.

      The scanner can therefore try every
      barcode format supported by the library.
    */

    const config = {

      fps: 15,

      /*
        A much larger scanning region
        for long student ID barcodes.
      */

      qrbox: function (
        width,
        height
      ) {

        return {

          width:
            Math.floor(width * 0.92),

          height:
            Math.floor(height * 0.60)

        };

      },

      /*
        This can improve scanning of
        certain 1D barcodes.
      */

      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      barcodeFound,

      function () {

        // Keep looking.

      }

    );


    button.innerHTML =
      "📷 SCANNER ACTIVE";


    showStatus(
      "Scanner active. Place the ENTIRE barcode inside the camera area.",
      "info"
    );

  }

  catch (error) {

    button.disabled = false;

    button.innerHTML =
      "📷 START BADGE SCANNER";


    showStatus(

      "<strong>Camera/Scanner Error</strong>" +
      "<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),

      "error"

    );

  }

}


async function barcodeFound(
  decodedText,
  decodedResult
) {

  if (locked) {
    return;
  }

  locked = true;


  let format = "Unknown";

  try {

    if (
      decodedResult &&
      decodedResult.result &&
      decodedResult.result.format
    ) {

      format =
        decodedResult.result.format.formatName;

    }

  }

  catch (error) {

    console.log(error);

  }


  showStatus(

    "✅ <strong>BARCODE READ!</strong>" +

    "<div class='barcode'>" +
    escapeHtml(decodedText) +
    "</div>" +

    "<br>Format: " +
    escapeHtml(format),

    "success"

  );


  try {

    await scanner.stop();

    scanner.clear();

  }

  catch (error) {

    console.log(error);

  }


  const button =
    document.getElementById("scanButton");

  button.disabled = false;

  button.innerHTML =
    "📷 SCAN ANOTHER BADGE";

}


function showStatus(
  message,
  type
) {

  const status =
    document.getElementById("status");

  status.className = type;

  status.innerHTML = message;

}


function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
