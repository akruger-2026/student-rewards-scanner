<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Student Rewards Scanner</title>

  <!-- Quagga2 Barcode Scanner -->
  <script
    src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      background: white;
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin: 8px 0 25px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #188038;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      display: none;
    }

    #scanner {
      width: 100%;
      min-height: 300px;
    }

    #scanner video,
    #scanner canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 38%;
      height: 24%;
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      border-top: 2px solid white;
      pointer-events: none;
      z-index: 11;
    }

    #status {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: #eef3fd;
      border: 2px solid #4285f4;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      border: 2px solid #d93025;
    }

    .barcode {
      font-size: 34px;
      font-weight: bold;
      margin-top: 12px;
      word-break: break-all;
    }

    .format {
      margin-top: 8px;
      color: #555;
    }

    .tip {
      margin-top: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>🏆 Student Rewards</h1>

  <div class="subtitle">
    Sporting Event Check-In
  </div>


  <button
    id="scanButton"
    type="button"
    onclick="startScanner()">
    📷 SCAN STUDENT BADGE
  </button>


  <div id="scanner-container">

    <div id="scanner"></div>

    <div class="scan-guide"></div>

    <div class="scan-line"></div>

  </div>


  <div id="status"></div>


  <div class="tip">
    Hold the badge horizontally.<br>
    Keep the entire barcode inside the white rectangle.
  </div>

</div>


<script>

let scannerRunning = false;
let scanLocked = false;


/* --------------------------
   START SCANNER
-------------------------- */

function startScanner() {

  const button =
    document.getElementById("scanButton");

  const container =
    document.getElementById("scanner-container");


  scanLocked = false;

  button.disabled = true;

  button.innerHTML =
    "STARTING CAMERA...";


  showStatus(
    "Starting camera...",
    "info"
  );


  container.style.display =
    "block";


  if (typeof Quagga === "undefined") {

    showStatus(
      "❌ Quagga barcode library did not load.",
      "error"
    );

    button.disabled = false;

    return;

  }


  Quagga.init({

    inputStream: {

      name: "Live",

      type: "LiveStream",

      target:
        document.querySelector("#scanner"),

      constraints: {

        facingMode: "environment",

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      },

      area: {

        top: "25%",

        right: "5%",

        left: "5%",

        bottom: "25%"

      }

    },


    locator: {

      patchSize: "medium",

      halfSample: false

    },


    locate: true,


    frequency: 10,


    decoder: {

      readers: [

        "code_128_reader",

        "code_39_reader",

        "code_93_reader",

        "i2of5_reader",

        "2of5_reader",

        "codabar_reader",

        "ean_reader",

        "ean_8_reader",

        "upc_reader",

        "upc_e_reader"

      ],

      multiple: false

    }

  },

  function(error) {

    if (error) {

      console.error(error);

      showStatus(
        "<strong>Scanner Error</strong><br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );


      button.disabled = false;

      button.innerHTML =
        "📷 SCAN STUDENT BADGE";

      return;

    }


    Quagga.start();

    scannerRunning = true;


    button.innerHTML =
      "📷 CAMERA ACTIVE";


    showStatus(
      "Camera active. Place the barcode inside the white rectangle.",
      "info"
    );

  });

}


/* --------------------------
   BARCODE DETECTED
-------------------------- */

Quagga.onDetected(function(data) {

  if (scanLocked) {
    return;
  }


  if (
    !data ||
    !data.codeResult ||
    !data.codeResult.code
  ) {

    return;

  }


  const code =
    String(
      data.codeResult.code
    ).trim();


  const format =
    data.codeResult.format ||
    "Unknown";


  /*
    Student IDs appear to be numeric.

    Requiring several digits helps
    prevent random false detections.
  */

  if (!/^\d{5,20}$/.test(code)) {

    return;

  }


  scanLocked = true;


  if (navigator.vibrate) {

    navigator.vibrate(150);

  }


  showStatus(

    "✅ <strong>BARCODE READ!</strong>" +

    "<div class='barcode'>" +
    escapeHtml(code) +
    "</div>" +

    "<div class='format'>" +
    "Format: " +
    escapeHtml(format) +
    "</div>",

    "success"

  );


  stopScanner();


  const button =
    document.getElementById("scanButton");


  button.disabled = false;

  button.innerHTML =
    "📷 SCAN ANOTHER BADGE";

});


/* --------------------------
   STOP SCANNER
-------------------------- */

function stopScanner() {

  if (scannerRunning) {

    Quagga.stop();

    scannerRunning = false;

  }


  document
    .getElementById("scanner-container")
    .style.display = "none";

}


/* --------------------------
   STATUS
-------------------------- */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById("status");


  status.className =
    type;


  status.innerHTML =
    message;

}


/* --------------------------
   SAFE TEXT
-------------------------- */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
