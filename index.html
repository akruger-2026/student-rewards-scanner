<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Student Rewards Scanner</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      background: white;
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin: 8px 0 22px;
      font-size: 17px;
    }

    /* PIN */

    .pin-section {
      background: #f8f9fa;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .pin-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #pin {
      width: 100%;
      padding: 15px;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .test-button {
      background: #1a73e8;
      color: white;
    }

    /* ACTIVE EVENT */

    #activeEventSection {
      display: none;
      margin: 18px 0;
    }

    .active-event {
      background: #e6f4ea;
      border: 3px solid #34a853;
      border-radius: 16px;
      padding: 18px;
    }

    .active-event-label {
      color: #137333;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .5px;
    }

    .active-event-name {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0 4px;
    }

    .active-event-date {
      color: #555;
      font-size: 16px;
    }

    .active-event-ready {
      margin-top: 10px;
      color: #137333;
      font-weight: bold;
    }

    .event-error {
      background: #fce8e6;
      border: 3px solid #d93025;
      border-radius: 16px;
      padding: 18px;
    }

    .event-error-title {
      color: #b3261e;
      font-size: 18px;
      font-weight: bold;
    }

    .event-error-message {
      margin-top: 8px;
      line-height: 1.4;
    }

    /* MODES */

    #modeSection {
      display: none;
      margin-top: 20px;
    }

    .mode-title {
      font-size: 15px;
      font-weight: bold;
      color: #555;
      margin-bottom: 10px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-button {
      background: #e8eaed;
      color: #333;
      padding: 15px 6px;
      font-size: 15px;
    }

    .setup-mode-button {
      grid-column: 1 / -1;
    }

    .mode-button.active-checkin {
      background: #188038;
      color: white;
    }

    .mode-button.active-reward {
      background: #9334e6;
      color: white;
    }

    .mode-button.active-setup {
      background: #1a73e8;
      color: white;
    }

    /* SCAN */

    .scan-button {
      margin-top: 16px;
      background: #188038;
      color: white;
      font-size: 20px;
    }

    .scan-button.reward-mode {
      background: #9334e6;
    }

    /* CAMERA */

    #scanner-container {
      position: relative;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      display: none;
    }

    #scanner {
      width: 100%;
      min-height: 300px;
    }

    #scanner video,
    #scanner canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    /*
      WORKING CODE 39 SCANNER SETTINGS.
      DO NOT CHANGE.
    */

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 42%;
      height: 16%;
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      border-top: 2px solid white;
      pointer-events: none;
      z-index: 11;
    }

    /* EVENT SETUP */

    #eventSetupSection {
      display: none;
      margin-top: 20px;
    }

    .setup-header {
      background: #e8f0fe;
      border: 2px solid #1a73e8;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .setup-header-title {
      font-size: 21px;
      font-weight: bold;
      color: #174ea6;
    }

    .setup-header-text {
      margin-top: 7px;
      font-size: 14px;
      color: #555;
      line-height: 1.4;
    }

    .event-option {
      background: white;
      border: 2px solid #dadce0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      text-align: left;
    }

    .event-option.current {
      background: #e6f4ea;
      border: 3px solid #34a853;
    }

    .event-option-name {
      font-size: 20px;
      font-weight: bold;
    }

    .event-option-date {
      margin-top: 5px;
      color: #666;
      font-size: 15px;
    }

    .event-option-id {
      margin-top: 4px;
      color: #888;
      font-size: 12px;
    }

    .current-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 11px;
      background: #188038;
      color: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .activate-button {
      margin-top: 13px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      padding: 14px;
    }

    .refresh-button {
      margin-top: 15px;
      background: #5f6368;
      color: white;
      font-size: 16px;
    }

    /* STATUS */

    #status {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: #eef3fd;
      border: 2px solid #4285f4;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }

    .warning {
      display: block !important;
      background: #fef7e0;
      border: 2px solid #f9ab00;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      border: 2px solid #d93025;
    }

    .reward-status {
      display: block !important;
      background: #f3e8fd;
      border: 2px solid #9334e6;
    }

    .student-name {
      font-size: 27px;
      font-weight: bold;
      margin-top: 10px;
    }

    .events-label {
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }

    .event-count {
      font-size: 44px;
      font-weight: bold;
      margin: 0;
    }

    .event-name {
      font-size: 15px;
      margin-bottom: 15px;
    }

    /* REWARDS */

    .reward-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      border: 2px solid #f9ab00;
    }

    .reward-heading {
      font-size: 15px;
      font-weight: bold;
      color: #8a5a00;
      margin-bottom: 5px;
    }

    .reward-name {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0;
    }

    .reward-progress {
      font-size: 16px;
      margin-top: 8px;
    }

    .unlocked-card {
      background: #fff7d6;
      border: 3px solid #f9ab00;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .unlocked-title {
      font-size: 23px;
      font-weight: bold;
    }

    .available-card {
      background: #f3e8fd;
      border: 2px solid #9334e6;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
    }

    .redeem-card {
      background: white;
      border: 3px solid #9334e6;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .redeem-button {
      margin-top: 14px;
      background: #9334e6;
      color: white;
    }

    .redeemed-box {
      background: #e6f4ea;
      border: 3px solid #34a853;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .redeemed-title {
      font-size: 23px;
      font-weight: bold;
    }

    .tip {
      margin-top: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>🏆 Student Rewards</h1>

  <div class="subtitle">
    Sporting Event Rewards Program
  </div>


  <!-- PIN -->

  <div class="pin-section">

    <label for="pin">
      Staff Scanner PIN
    </label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter PIN"
    >

    <button
      id="testButton"
      class="test-button"
      type="button"
      onclick="testConnection()">
      TEST CONNECTION
    </button>

  </div>


  <!-- ACTIVE EVENT -->

  <div id="activeEventSection"></div>


  <!-- MODE -->

  <div id="modeSection">

    <div class="mode-title">
      SELECT MODE
    </div>

    <div class="mode-buttons">

      <button
        id="checkinModeButton"
        class="mode-button"
        onclick="setMode('CHECK_IN')">
        🏟️ EVENT<br>CHECK-IN
      </button>

      <button
        id="rewardModeButton"
        class="mode-button"
        onclick="setMode('REWARD_LOOKUP')">
        🎁 REDEEM<br>REWARD
      </button>

      <button
        id="setupModeButton"
        class="mode-button setup-mode-button"
        onclick="setMode('EVENT_SETUP')">
        ⚙️ EVENT SETUP
      </button>

    </div>

  </div>


  <!-- SCAN -->

  <button
    id="scanButton"
    class="scan-button"
    type="button"
    onclick="startScanner()"
    disabled>
    📷 SCAN STUDENT BADGE
  </button>


  <!-- CAMERA -->

  <div id="scanner-container">

    <div id="scanner"></div>

    <div class="scan-guide"></div>

    <div class="scan-line"></div>

  </div>


  <!-- EVENT SETUP -->

  <div id="eventSetupSection"></div>


  <!-- RESULTS -->

  <div id="status"></div>


  <div
    class="tip"
    id="tip">
    Connect the scanner to begin.
  </div>

</div>


<script>

/*************************************************
 * SETTINGS
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwEz-Qr2m9_176d2xWeBSHmNnVKpAJCryw0D8Bsy9NY-kjC_O_RRNNwskb-cK8yOJ3tNw/exec";


let scannerRunning = false;

let scanLocked = false;

let connectionVerified = false;

let activeEventReady = false;

let currentMode = "CHECK_IN";

let currentStudentId = null;


/*************************************************
 * CONNECTION TEST
 *************************************************/

async function testConnection() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    showStatus(
      "Please enter the Staff Scanner PIN.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "testButton"
    );


  button.disabled = true;

  button.innerHTML =
    "TESTING...";


  showStatus(
    "Connecting to the Student Rewards system...",
    "info"
  );


  try {

    const result =
      await sendToServer(
        "__TEST__",
        "CHECK_IN"
      );


    if (
      result.success &&
      result.type ===
        "CONNECTION_TEST"
    ) {

      connectionVerified = true;


      button.innerHTML =
        "✓ CONNECTED";


      document
        .getElementById(
          "modeSection"
        )
        .style.display =
          "block";


      displayActiveEvent(
        result.activeEvent
      );


      setMode(
        "CHECK_IN"
      );


      showStatus(
        "✅ <strong>CONNECTED!</strong><br><br>" +
        "Scanner is ready.",
        "success"
      );

    } else {

      connectionVerified = false;

      button.disabled = false;

      button.innerHTML =
        "TEST CONNECTION";


      showStatus(
        escapeHtml(
          result.message ||
          "Connection failed."
        ),
        "error"
      );
    }

  } catch (error) {

    connectionVerified = false;

    button.disabled = false;

    button.innerHTML =
      "TEST CONNECTION";


    showStatus(
      "<strong>Connection Error</strong><br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),
      "error"
    );
  }
}


/*************************************************
 * DISPLAY ACTIVE EVENT
 *************************************************/

function displayActiveEvent(
  event
) {

  const section =
    document.getElementById(
      "activeEventSection"
    );


  section.style.display =
    "block";


  if (
    event &&
    event.success &&
    event.type ===
      "ACTIVE_EVENT"
  ) {

    activeEventReady = true;


    section.innerHTML =

      "<div class='active-event'>" +

      "<div class='active-event-label'>" +
      "🟢 ACTIVE EVENT" +
      "</div>" +

      "<div class='active-event-name'>" +
      escapeHtml(
        event.displayName
      ) +
      "</div>" +

      "<div class='active-event-date'>" +
      escapeHtml(
        event.date
      ) +
      "</div>" +

      "<div class='active-event-ready'>" +
      "✓ Ready for student check-in" +
      "</div>" +

      "</div>";


    return;
  }


  activeEventReady = false;


  let title =
    "⚠️ CHECK-IN NOT AVAILABLE";


  let message =
    "There is currently no active event.";


  if (
    event &&
    event.type ===
      "MULTIPLE_ACTIVE_EVENTS"
  ) {

    title =
      "⚠️ MULTIPLE ACTIVE EVENTS";


    message =
      "More than one event is marked TRUE. " +
      "Use Event Setup to select the correct event.";

  } else if (
    event &&
    event.message
  ) {

    message =
      event.message;
  }


  section.innerHTML =

    "<div class='event-error'>" +

    "<div class='event-error-title'>" +
    title +
    "</div>" +

    "<div class='event-error-message'>" +
    escapeHtml(
      message
    ) +
    "</div>" +

    "<br>" +

    "<strong>Reward Redemption and Event Setup are still available.</strong>" +

    "</div>";
}


/*************************************************
 * MODE
 *************************************************/

function setMode(mode) {

  currentMode =
    mode;

  currentStudentId =
    null;


  stopScanner();


  const checkinButton =
    document.getElementById(
      "checkinModeButton"
    );

  const rewardButton =
    document.getElementById(
      "rewardModeButton"
    );

  const setupButton =
    document.getElementById(
      "setupModeButton"
    );

  const scanButton =
    document.getElementById(
      "scanButton"
    );

  const setupSection =
    document.getElementById(
      "eventSetupSection"
    );


  checkinButton.className =
    "mode-button";

  rewardButton.className =
    "mode-button";

  setupButton.className =
    "mode-button setup-mode-button";

  setupSection.style.display =
    "none";


  if (
    mode ===
    "CHECK_IN"
  ) {

    checkinButton.className =
      "mode-button active-checkin";


    scanButton.style.display =
      "block";

    scanButton.className =
      "scan-button";

    scanButton.innerHTML =
      "📷 SCAN STUDENT BADGE";


    scanButton.disabled =
      !connectionVerified ||
      !activeEventReady;


    checkinButton.disabled =
      !activeEventReady;


    clearStatus();

    updateTip();

    return;
  }


  if (
    mode ===
    "REWARD_LOOKUP"
  ) {

    rewardButton.className =
      "mode-button active-reward";


    scanButton.style.display =
      "block";

    scanButton.className =
      "scan-button reward-mode";

    scanButton.innerHTML =
      "🎁 SCAN BADGE FOR REWARDS";

    scanButton.disabled =
      !connectionVerified;


    clearStatus();

    updateTip();

    return;
  }


  /*********************************************
   * EVENT SETUP MODE
   *********************************************/

  setupButton.className =
    "mode-button setup-mode-button active-setup";


  scanButton.style.display =
    "none";


  setupSection.style.display =
    "block";


  clearStatus();

  updateTip();

  loadEvents();
}


/*************************************************
 * TIP
 *************************************************/

function updateTip() {

  const tip =
    document.getElementById(
      "tip"
    );


  if (
    currentMode ===
      "CHECK_IN"
  ) {

    if (
      activeEventReady
    ) {

      tip.innerHTML =
        "🏟️ <strong>Event Check-In Mode</strong>" +
        "<br>" +
        "Scanning records attendance for the active event.";

    } else {

      tip.innerHTML =
        "⚠️ <strong>Event Check-In Disabled</strong>" +
        "<br>" +
        "Use Event Setup to select an active event.";
    }


    return;
  }


  if (
    currentMode ===
      "REWARD_LOOKUP"
  ) {

    tip.innerHTML =
      "🎁 <strong>Reward Redemption Mode</strong>" +
      "<br>" +
      "Scanning looks up rewards only. It does NOT record attendance.";

    return;
  }


  tip.innerHTML =
    "⚙️ <strong>Event Setup Mode</strong>" +
    "<br>" +
    "Choose which sporting event should receive student check-ins.";
}


/*************************************************
 * SEND TO APPS SCRIPT
 *************************************************/

async function sendToServer(
  studentId = "",
  action = "",
  rewardLevel = "",
  eventId = ""
) {

  const pin =
    document
      .getElementById(
        "pin"
      )
      .value
      .trim();


  const response =
    await fetch(

      API_URL,

      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            studentId:
              studentId,

            pin:
              pin,

            action:
              action,

            rewardLevel:
              rewardLevel,

            eventId:
              eventId

          }),

        redirect:
          "follow"

      }

    );


  const text =
    await response.text();


  try {

    return JSON.parse(
      text
    );

  } catch (error) {

    throw new Error(
      "The rewards server returned an unexpected response."
    );
  }
}


/*************************************************
 * LOAD EVENT LIST
 *************************************************/

async function loadEvents() {

  const section =
    document.getElementById(
      "eventSetupSection"
    );


  section.innerHTML =

    "<div class='setup-header'>" +

    "<div class='setup-header-title'>" +
    "⚙️ Event Setup" +
    "</div>" +

    "<div class='setup-header-text'>" +
    "Loading events..." +
    "</div>" +

    "</div>";


  try {

    const result =
      await sendToServer(
        "",
        "GET_EVENTS"
      );


    if (
      !result.success ||
      result.type !==
        "EVENT_LIST"
    ) {

      section.innerHTML =

        "<div class='event-error'>" +

        "<div class='event-error-title'>" +
        "Unable to Load Events" +
        "</div>" +

        "<div class='event-error-message'>" +
        escapeHtml(
          result.message ||
          "Unknown error."
        ) +
        "</div>" +

        "</div>";


      return;
    }


    displayEventList(
      result
    );


  } catch (error) {

    section.innerHTML =

      "<div class='event-error'>" +

      "<div class='event-error-title'>" +
      "Unable to Load Events" +
      "</div>" +

      "<div class='event-error-message'>" +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      "</div>" +

      "</div>";
  }
}


/*************************************************
 * DISPLAY EVENT LIST
 *************************************************/

function displayEventList(
  result
) {

  const section =
    document.getElementById(
      "eventSetupSection"
    );


  let html =

    "<div class='setup-header'>" +

    "<div class='setup-header-title'>" +
    "⚙️ Event Setup" +
    "</div>" +

    "<div class='setup-header-text'>" +
    "Select the event that should receive student attendance. " +
    "Only one event can be active at a time." +
    "</div>" +

    "</div>";


  const events =
    result.events || [];


  if (
    events.length === 0
  ) {

    html +=

      "<div class='event-error'>" +

      "<div class='event-error-title'>" +
      "No Events Found" +
      "</div>" +

      "<div class='event-error-message'>" +
      "Add events to the Events sheet first." +
      "</div>" +

      "</div>";


    section.innerHTML =
      html;


    return;
  }


  events.forEach(
    function(event) {

      html +=

        "<div class='event-option " +

        (
          event.active
            ? "current"
            : ""
        ) +

        "'>" +

        "<div class='event-option-name'>" +
        escapeHtml(
          event.displayName
        ) +
        "</div>" +

        "<div class='event-option-date'>" +
        escapeHtml(
          event.date
        ) +
        "</div>" +

        "<div class='event-option-id'>" +
        "Event ID: " +
        escapeHtml(
          event.eventId
        ) +
        "</div>";


      if (
        event.active
      ) {

        html +=

          "<div class='current-badge'>" +
          "✓ CURRENT ACTIVE EVENT" +
          "</div>";

      } else {

        html +=

          "<button " +
          "class='activate-button' " +
          "onclick='confirmEventChange(" +

          JSON.stringify(
            event.eventId
          ) +

          "," +

          JSON.stringify(
            event.displayName
          ) +

          ")'>" +

          "MAKE ACTIVE" +

          "</button>";
      }


      html +=
        "</div>";
    }
  );


  html +=

    "<button " +
    "class='refresh-button' " +
    "onclick='loadEvents()'>" +
    "↻ REFRESH EVENT LIST" +
    "</button>";


  section.innerHTML =
    html;
}


/*************************************************
 * CONFIRM EVENT CHANGE
 *************************************************/

function confirmEventChange(
  eventId,
  eventName
) {

  const confirmed =
    window.confirm(

      "Make this the active event?\n\n" +

      eventName +

      "\n\nStudent check-ins will be recorded to this event."

    );


  if (!confirmed) {
    return;
  }


  activateEvent(
    eventId
  );
}


/*************************************************
 * ACTIVATE EVENT
 *************************************************/

async function activateEvent(
  eventId
) {

  const section =
    document.getElementById(
      "eventSetupSection"
    );


  section.innerHTML =

    "<div class='setup-header'>" +

    "<div class='setup-header-title'>" +
    "⚙️ Updating Active Event..." +
    "</div>" +

    "<div class='setup-header-text'>" +
    "Please wait." +
    "</div>" +

    "</div>";


  try {

    const result =
      await sendToServer(
        "",
        "SET_ACTIVE_EVENT",
        "",
        eventId
      );


    if (
      !result.success ||
      result.type !==
        "ACTIVE_EVENT_CHANGED"
    ) {

      showStatus(
        "<strong>Unable to Change Event</strong>" +
        "<br><br>" +
        escapeHtml(
          result.message ||
          "Unknown error."
        ),
        "error"
      );


      await loadEvents();

      return;
    }


    /*********************************************
     * UPDATE TOP ACTIVE EVENT DISPLAY
     *********************************************/

    displayActiveEvent(
      result.activeEvent
    );


    /*********************************************
     * RE-ENABLE CHECK-IN MODE
     *********************************************/

    document
      .getElementById(
        "checkinModeButton"
      )
      .disabled =
        false;


    showStatus(
      "✅ <strong>ACTIVE EVENT CHANGED</strong>" +
      "<br><br>" +
      escapeHtml(
        result.activeEvent.displayName
      ) +
      "<br>" +
      escapeHtml(
        result.activeEvent.date
      ) +
      "<br><br>" +
      "Student check-ins will now be recorded to this event.",
      "success"
    );


    /*********************************************
     * REFRESH EVENT LIST
     *********************************************/

    await loadEvents();


  } catch (error) {

    showStatus(
      "<strong>Event Setup Error</strong>" +
      "<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),
      "error"
    );


    await loadEvents();
  }
}


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  if (
    !connectionVerified
  ) {

    showStatus(
      "Please test the connection before scanning.",
      "error"
    );

    return;
  }


  if (
    currentMode ===
      "CHECK_IN" &&
    !activeEventReady
  ) {

    showStatus(
      "Event Check-In is disabled because there is no valid active event.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "scanButton"
    );

  const container =
    document.getElementById(
      "scanner-container"
    );


  scanLocked = false;

  button.disabled = true;

  button.innerHTML =
    "STARTING CAMERA...";

  container.style.display =
    "block";


  showStatus(
    "Starting camera...",
    "info"
  );


  if (
    typeof Quagga ===
      "undefined"
  ) {

    showStatus(
      "Quagga barcode library did not load.",
      "error"
    );

    button.disabled =
      false;

    resetScanButton();

    return;
  }


  /*************************************************
   * WORKING CODE 39 CONFIGURATION
   *
   * DO NOT CHANGE
   *************************************************/

  Quagga.init({

    inputStream: {

      name:
        "Live",

      type:
        "LiveStream",

      target:
        document.querySelector(
          "#scanner"
        ),

      constraints: {

        facingMode:
          "environment",

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      },

      area: {

        top:
          "38%",

        right:
          "5%",

        left:
          "5%",

        bottom:
          "38%"

      }

    },


    locator: {

      patchSize:
        "medium",

      halfSample:
        false

    },


    locate:
      true,


    frequency:
      10,


    decoder: {

      readers: [
        "code_39_reader"
      ],

      multiple:
        false

    }

  },


  function(error) {

    if (error) {

      console.error(
        error
      );


      showStatus(
        "<strong>Scanner Error</strong><br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );


      button.disabled =
        false;


      resetScanButton();

      return;
    }


    Quagga.start();

    scannerRunning =
      true;


    button.innerHTML =
      "📷 CAMERA ACTIVE";


    showStatus(
      "Camera active. Place the entire barcode inside the white rectangle.",
      "info"
    );
  });
}


/*************************************************
 * BARCODE DETECTED
 *************************************************/

Quagga.onDetected(
  async function(data) {

    if (scanLocked) {
      return;
    }


    if (
      !data ||
      !data.codeResult ||
      !data.codeResult.code
    ) {
      return;
    }


    const code =
      String(
        data.codeResult.code
      ).trim();


    if (
      !/^\d{6}$/.test(
        code
      )
    ) {
      return;
    }


    scanLocked =
      true;

    currentStudentId =
      code;


    stopScanner();


    if (
      currentMode ===
        "CHECK_IN"
    ) {

      showStatus(
        "✅ Badge read: <strong>" +
        escapeHtml(code) +
        "</strong><br><br>" +
        "Recording attendance...",
        "info"
      );

    } else {

      showStatus(
        "🎁 Badge read: <strong>" +
        escapeHtml(code) +
        "</strong><br><br>" +
        "Looking up rewards...",
        "info"
      );
    }


    try {

      const result =
        await sendToServer(
          code,
          currentMode
        );


      if (
        currentMode ===
          "CHECK_IN"
      ) {

        displayCheckInResult(
          result
        );

      } else {

        displayRewardLookup(
          result
        );
      }


    } catch (error) {

      showStatus(
        "<strong>System Error</strong><br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );
    }


    resetScanButton();
  }
);


/*************************************************
 * CHECK-IN RESULT
 *************************************************/

function displayCheckInResult(
  result
) {

  if (
    result.success &&
    result.type ===
      "CHECKED_IN"
  ) {

    let html =

      "✅ <strong>CHECKED IN!</strong>" +

      "<div class='student-name'>" +
      escapeHtml(
        result.studentName
      ) +
      "</div>" +

      "<div class='events-label'>" +
      "EVENTS ATTENDED" +
      "</div>" +

      "<div class='event-count'>" +
      escapeHtml(
        result.totalEvents
      ) +
      "</div>" +

      "<div class='event-name'>" +
      escapeHtml(
        result.event
      ) +
      "</div>";


    html +=
      buildRewardDisplay(
        result.rewards
      );


    showStatus(
      html,
      "success"
    );

    return;
  }


  if (
    result.type ===
      "DUPLICATE"
  ) {

    let html =

      "⚠️ <strong>ALREADY CHECKED IN</strong>" +

      "<div class='student-name'>" +
      escapeHtml(
        result.studentName ||
        ""
      ) +
      "</div>" +

      "<br>" +

      escapeHtml(
        result.message ||
        ""
      );


    html +=
      buildRewardDisplay(
        result.rewards
      );


    showStatus(
      html,
      "warning"
    );

    return;
  }


  if (
    result.type ===
      "NO_ACTIVE_EVENT" ||
    result.type ===
      "MULTIPLE_ACTIVE_EVENTS"
  ) {

    activeEventReady =
      false;


    document
      .getElementById(
        "checkinModeButton"
      )
      .disabled =
        true;
  }


  showStatus(
    "<strong>Unable to Check In</strong>" +
    "<br><br>" +
    escapeHtml(
      result.message ||
      "Unknown error."
    ),
    "error"
  );
}


/*************************************************
 * REWARD LOOKUP
 *************************************************/

function displayRewardLookup(
  result
) {

  if (
    !result.success ||
    result.type !==
      "REWARD_LOOKUP"
  ) {

    showStatus(
      "<strong>Unable to Find Rewards</strong>" +
      "<br><br>" +
      escapeHtml(
        result.message ||
        "Unknown error."
      ),
      "error"
    );

    return;
  }


  let html =

    "🎁 <strong>REWARD REDEMPTION</strong>" +

    "<div class='student-name'>" +
    escapeHtml(
      result.studentName
    ) +
    "</div>" +

    "<div class='events-label'>" +
    "EVENTS ATTENDED" +
    "</div>" +

    "<div class='event-count'>" +
    escapeHtml(
      result.totalEvents
    ) +
    "</div>";


  const available =
    result.rewards &&
    result.rewards.availableRewards

      ? result.rewards.availableRewards

      : [];


  if (
    available.length === 0
  ) {

    html +=

      "<div class='available-card'>" +

      "<strong>" +
      "No rewards currently available to redeem." +
      "</strong>" +

      "</div>";


    if (
      result.rewards &&
      result.rewards.nextReward
    ) {

      html +=
        buildNextReward(
          result.rewards.nextReward
        );
    }


    showStatus(
      html,
      "reward-status"
    );

    return;
  }


  available.forEach(
    function(reward) {

      html +=

        "<div class='redeem-card'>" +

        "<div class='reward-heading'>" +
        "AVAILABLE REWARD" +
        "</div>" +

        "<div class='reward-name'>" +
        escapeHtml(
          reward.reward
        ) +
        "</div>" +

        "<div>" +
        escapeHtml(
          reward.level
        ) +
        " • " +
        escapeHtml(
          reward.eventsRequired
        ) +
        " Events" +
        "</div>" +

        "<button " +
        "class='redeem-button' " +
        "onclick='confirmRedemption(" +

        JSON.stringify(
          reward.level
        ) +

        "," +

        JSON.stringify(
          reward.reward
        ) +

        ")'>" +

        "🎁 REDEEM REWARD" +

        "</button>" +

        "</div>";
    }
  );


  if (
    result.rewards.nextReward
  ) {

    html +=
      buildNextReward(
        result.rewards.nextReward
      );
  }


  showStatus(
    html,
    "reward-status"
  );
}


/*************************************************
 * CONFIRM REDEMPTION
 *************************************************/

function confirmRedemption(
  rewardLevel,
  rewardName
) {

  const confirmed =
    window.confirm(

      "Redeem this reward?\n\n" +

      rewardName +

      "\n\nOnly confirm after the reward has been given to the student."

    );


  if (!confirmed) {
    return;
  }


  redeemReward(
    rewardLevel
  );
}


/*************************************************
 * REDEEM REWARD
 *************************************************/

async function redeemReward(
  rewardLevel
) {

  if (
    !currentStudentId
  ) {

    showStatus(
      "Please scan the student's badge again.",
      "error"
    );

    return;
  }


  showStatus(
    "🎁 Recording reward redemption...",
    "info"
  );


  try {

    const result =
      await sendToServer(

        currentStudentId,

        "REDEEM_REWARD",

        rewardLevel

      );


    if (
      result.success &&
      result.type ===
        "REWARD_REDEEMED"
    ) {

      let html =

        "<div class='redeemed-box'>" +

        "<div class='redeemed-title'>" +
        "✅ REWARD REDEEMED!" +
        "</div>" +

        "<div class='student-name'>" +
        escapeHtml(
          result.studentName
        ) +
        "</div>" +

        "<div class='reward-name'>" +
        "🎁 " +
        escapeHtml(
          result.reward
        ) +
        "</div>" +

        "<div>" +
        "Redemption recorded successfully." +
        "</div>" +

        "</div>";


      if (
        result.rewards &&
        result.rewards.nextReward
      ) {

        html +=
          buildNextReward(
            result.rewards.nextReward
          );
      }


      showStatus(
        html,
        "success"
      );


      currentStudentId =
        null;


      return;
    }


    if (
      result.type ===
        "ALREADY_REDEEMED"
    ) {

      showStatus(

        "⚠️ <strong>ALREADY REDEEMED</strong>" +

        "<br><br>" +

        escapeHtml(
          result.reward || ""
        ) +

        "<br>" +

        escapeHtml(
          result.message || ""
        ),

        "warning"

      );


      return;
    }


    showStatus(
      "<strong>Unable to Redeem Reward</strong>" +
      "<br><br>" +
      escapeHtml(
        result.message ||
        "Unknown error."
      ),
      "error"
    );


  } catch (error) {

    showStatus(
      "<strong>Redemption Error</strong>" +
      "<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),
      "error"
    );
  }
}


/*************************************************
 * CHECK-IN REWARD DISPLAY
 *************************************************/

function buildRewardDisplay(
  rewards
) {

  if (!rewards) {
    return "";
  }


  let html =
    "";


  if (
    rewards.justUnlocked &&
    !rewards.justUnlocked.redeemed
  ) {

    html +=

      "<div class='unlocked-card'>" +

      "<div class='unlocked-title'>" +
      "🎉 REWARD UNLOCKED!" +
      "</div>" +

      "<div class='reward-name'>" +
      escapeHtml(
        rewards.justUnlocked.reward
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        rewards.justUnlocked.level
      ) +
      " • " +
      escapeHtml(
        rewards.justUnlocked.eventsRequired
      ) +
      " Events" +
      "</div>" +

      "<div class='reward-progress'>" +
      "Available to Redeem" +
      "</div>" +

      "</div>";
  }


  if (
    rewards.availableCount > 0
  ) {

    html +=

      "<div class='available-card'>" +

      "<strong>🎁 " +

      escapeHtml(
        rewards.availableCount
      ) +

      (
        rewards.availableCount === 1
          ? " Reward Available"
          : " Rewards Available"
      ) +

      "</strong>" +

      "<br>" +

      "Not yet redeemed" +

      "</div>";
  }


  if (
    rewards.nextReward
  ) {

    html +=
      buildNextReward(
        rewards.nextReward
      );

  } else if (
    rewards.allRewardsEarned
  ) {

    html +=

      "<div class='reward-card'>" +

      "<div class='reward-heading'>" +
      "🏆 ALL REWARD LEVELS EARNED" +
      "</div>" +

      "</div>";
  }


  return html;
}


/*************************************************
 * NEXT REWARD
 *************************************************/

function buildNextReward(
  reward
) {

  const remaining =
    reward.eventsRemaining;


  return (

    "<div class='reward-card'>" +

    "<div class='reward-heading'>" +
    "🎁 NEXT REWARD" +
    "</div>" +

    "<div class='reward-name'>" +
    escapeHtml(
      reward.reward
    ) +
    "</div>" +

    "<div>" +
    escapeHtml(
      reward.level
    ) +
    " • " +
    escapeHtml(
      reward.eventsRequired
    ) +
    " Events" +
    "</div>" +

    "<div class='reward-progress'>" +

    (
      remaining === 1

        ? "<strong>1 more event to go!</strong>"

        : "<strong>" +
          escapeHtml(
            remaining
          ) +
          " more events to go!</strong>"
    ) +

    "</div>" +

    "</div>"

  );
}


/*************************************************
 * RESET SCAN BUTTON
 *************************************************/

function resetScanButton() {

  const button =
    document.getElementById(
      "scanButton"
    );


  if (
    currentMode ===
      "CHECK_IN"
  ) {

    button.style.display =
      "block";

    button.innerHTML =
      "📷 SCAN NEXT STUDENT";

    button.disabled =
      !connectionVerified ||
      !activeEventReady;


  } else if (
    currentMode ===
      "REWARD_LOOKUP"
  ) {

    button.style.display =
      "block";

    button.innerHTML =
      "🎁 SCAN BADGE FOR REWARDS";

    button.disabled =
      !connectionVerified;
  }
}


/*************************************************
 * STOP SCANNER
 *************************************************/

function stopScanner() {

  if (
    scannerRunning
  ) {

    Quagga.stop();

    scannerRunning =
      false;
  }


  document
    .getElementById(
      "scanner-container"
    )
    .style.display =
      "none";
}


/*************************************************
 * STATUS
 *************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    type;


  status.innerHTML =
    message;
}


function clearStatus() {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "";

  status.innerHTML =
    "";

  status.style.display =
    "none";
}


/*************************************************
 * SAFE DISPLAY
 *************************************************/

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}

</script>
