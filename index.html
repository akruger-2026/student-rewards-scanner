<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Student Rewards Scanner</title>

  <!-- Quagga2 -->
  <script
    src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      background: white;
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin: 8px 0 25px;
      font-size: 17px;
    }

    .pin-section {
      background: #f8f9fa;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .pin-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #pin {
      width: 100%;
      padding: 15px;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .test-button {
      background: #1a73e8;
      color: white;
    }

    .scan-button {
      background: #188038;
      color: white;
      font-size: 20px;
    }

    button:disabled {
      opacity: .55;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      display: none;
    }

    #scanner {
      width: 100%;
      min-height: 300px;
    }

    #scanner video,
    #scanner canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 38%;
      height: 24%;
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      border-top: 2px solid white;
      pointer-events: none;
      z-index: 11;
    }

    #status {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: #eef3fd;
      border: 2px solid #4285f4;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }

    .warning {
      display: block !important;
      background: #fef7e0;
      border: 2px solid #f9ab00;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      border: 2px solid #d93025;
    }

    .student-name {
      font-size: 27px;
      font-weight: bold;
      margin-top: 10px;
    }

    .event-count {
      font-size: 44px;
      font-weight: bold;
      margin: 8px 0;
    }

    .small {
      color: #666;
      font-size: 14px;
    }

    .tip {
      margin-top: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>🏆 Student Rewards</h1>

  <div class="subtitle">
    Sporting Event Check-In
  </div>


  <!-- PIN -->

  <div class="pin-section">

    <label for="pin">
      Staff Scanner PIN
    </label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter PIN"
    >

    <button
      id="testButton"
      class="test-button"
      type="button"
      onclick="testConnection()">
      TEST CONNECTION
    </button>

  </div>


  <!-- SCANNER -->

  <button
    id="scanButton"
    class="scan-button"
    type="button"
    onclick="startScanner()"
    disabled>
    📷 SCAN STUDENT BADGE
  </button>


  <div id="scanner-container">

    <div id="scanner"></div>

    <div class="scan-guide"></div>

    <div class="scan-line"></div>

  </div>


  <div id="status"></div>


  <div class="tip">
    First, enter the staff PIN and test the connection.
    <br><br>
    Once connected, scan the barcode on the student's badge.
  </div>

</div>


<script>

/*************************************************
 * SETTINGS
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwEz-Qr2m9_176d2xWeBSHmNnVKpAJCryw0D8Bsy9NY-kjC_O_RRNNwskb-cK8yOJ3tNw/exec";


let scannerRunning = false;

let scanLocked = false;

let connectionVerified = false;


/*************************************************
 * TEST CONNECTION
 *************************************************/

async function testConnection() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    showStatus(
      "Please enter the Staff Scanner PIN.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("testButton");


  button.disabled = true;

  button.innerHTML =
    "TESTING...";


  showStatus(
    "Testing connection to the attendance system...",
    "info"
  );


  try {

    const result =
      await sendToServer(
        "__TEST__",
        pin
      );


    if (
      result.success &&
      result.type ===
        "CONNECTION_TEST"
    ) {

      connectionVerified = true;


      document
        .getElementById("scanButton")
        .disabled = false;


      button.innerHTML =
        "✓ CONNECTED";


      showStatus(
        "✅ <strong>CONNECTED!</strong>" +
        "<br><br>" +
        "The scanner can communicate with the attendance system.",
        "success"
      );

    }

    else {

      connectionVerified = false;

      button.disabled = false;

      button.innerHTML =
        "TEST CONNECTION";


      showStatus(
        escapeHtml(
          result.message ||
          "Connection failed."
        ),
        "error"
      );

    }

  }

  catch (error) {

    connectionVerified = false;

    button.disabled = false;

    button.innerHTML =
      "TEST CONNECTION";


    showStatus(
      "<strong>Connection Error</strong>" +
      "<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),
      "error"
    );

  }

}


/*************************************************
 * SEND REQUEST TO APPS SCRIPT
 *************************************************/

async function sendToServer(
  studentId,
  pin
) {

  const response =
    await fetch(
      API_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            studentId:
              studentId,

            pin:
              pin

          }),

        redirect:
          "follow"

      }
    );


  const text =
    await response.text();


  try {

    return JSON.parse(text);

  }

  catch (error) {

    throw new Error(
      "The attendance server returned an unexpected response."
    );

  }

}


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  if (!connectionVerified) {

    showStatus(
      "Please test the connection before scanning.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("scanButton");


  const container =
    document.getElementById(
      "scanner-container"
    );


  scanLocked = false;


  button.disabled = true;

  button.innerHTML =
    "STARTING CAMERA...";


  container.style.display =
    "block";


  showStatus(
    "Starting camera...",
    "info"
  );


  if (
    typeof Quagga ===
    "undefined"
  ) {

    showStatus(
      "Quagga barcode library did not load.",
      "error"
    );

    button.disabled = false;

    return;

  }


  Quagga.init({

    inputStream: {

      name:
        "Live",

      type:
        "LiveStream",

      target:
        document.querySelector(
          "#scanner"
        ),

      constraints: {

        facingMode:
          "environment",

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      },

      area: {

        top:
          "25%",

        right:
          "5%",

        left:
          "5%",

        bottom:
          "25%"

      }

    },


    locator: {

      patchSize:
        "medium",

      halfSample:
        false

    },


    locate:
      true,


    frequency:
      10,


    /*
     * We now know the student badges
     * use CODE 39.
     *
     * Limiting the scanner to Code 39
     * should improve speed and reduce
     * false reads.
     */

    decoder: {

      readers: [
        "code_39_reader"
      ],

      multiple:
        false

    }

  },


  function(error) {

    if (error) {

      showStatus(
        "<strong>Scanner Error</strong>" +
        "<br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );


      button.disabled = false;

      button.innerHTML =
        "📷 SCAN STUDENT BADGE";


      return;

    }


    Quagga.start();

    scannerRunning = true;


    button.innerHTML =
      "📷 CAMERA ACTIVE";


    showStatus(
      "Camera active. Place the badge barcode inside the white rectangle.",
      "info"
    );

  });

}


/*************************************************
 * BARCODE DETECTED
 *************************************************/

Quagga.onDetected(
  async function(data) {

    if (scanLocked) {
      return;
    }


    if (
      !data ||
      !data.codeResult ||
      !data.codeResult.code
    ) {

      return;

    }


    const code =
      String(
        data.codeResult.code
      ).trim();


    /*
     * Your student IDs are six-digit
     * numbers, so reject obviously
     * incorrect reads.
     */

    if (
      !/^\d{6}$/.test(code)
    ) {

      return;

    }


    scanLocked = true;


    stopScanner();


    showStatus(
      "Badge " +
      escapeHtml(code) +
      " read.<br><br>Recording attendance...",
      "info"
    );


    const pin =
      document
        .getElementById("pin")
        .value
        .trim();


    try {

      const result =
        await sendToServer(
          code,
          pin
        );


      displayCheckInResult(
        result
      );

    }

    catch (error) {

      showStatus(
        "<strong>Attendance Error</strong>" +
        "<br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );

    }


    const button =
      document.getElementById(
        "scanButton"
      );


    button.disabled = false;

    button.innerHTML =
      "📷 SCAN NEXT STUDENT";

  }
);


/*************************************************
 * DISPLAY CHECK-IN RESULT
 *************************************************/

function displayCheckInResult(
  result
) {

  if (
    result.success &&
    result.type ===
      "CHECKED_IN"
  ) {

    showStatus(

      "✅ <strong>CHECKED IN!</strong>" +

      "<div class='student-name'>" +
      escapeHtml(
        result.studentName
      ) +
      "</div>" +

      "<div class='small'>" +
      "Events Attended" +
      "</div>" +

      "<div class='event-count'>" +
      escapeHtml(
        result.totalEvents
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        result.event
      ) +
      "</div>",

      "success"

    );

    return;

  }


  if (
    result.type ===
      "DUPLICATE"
  ) {

    showStatus(

      "⚠️ <strong>ALREADY CHECKED IN</strong>" +

      "<div class='student-name'>" +
      escapeHtml(
        result.studentName || ""
      ) +
      "</div>" +

      "<br>" +

      escapeHtml(
        result.message
      ),

      "warning"

    );

    return;

  }


  showStatus(

    "<strong>Unable to Check In</strong>" +

    "<br><br>" +

    escapeHtml(
      result.message ||
      "Unknown error."
    ),

    "error"

  );

}


/*************************************************
 * STOP SCANNER
 *************************************************/

function stopScanner() {

  if (scannerRunning) {

    Quagga.stop();

    scannerRunning = false;

  }


  document
    .getElementById(
      "scanner-container"
    )
    .style.display =
      "none";

}


/*************************************************
 * STATUS MESSAGE
 *************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    type;


  status.innerHTML =
    message;

}


/*************************************************
 * SAFE DISPLAY
 *************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
