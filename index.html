<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Student Rewards Scanner</title>

  <!-- Barcode scanning library -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      font-size: 17px;
      margin-top: 8px;
      margin-bottom: 30px;
    }

    .scan-button {
      width: 100%;
      padding: 19px;
      border: none;
      border-radius: 12px;
      background: #188038;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .scan-button:disabled {
      opacity: .6;
    }

    .instructions {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
      margin: 18px 5px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.4;
    }

    .info {
      display: block !important;
      background: #eef3fd;
      border: 2px solid #4285f4;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      border: 2px solid #d93025;
    }

    .barcode {
      margin-top: 12px;
      font-size: 34px;
      font-weight: bold;
      word-break: break-all;
    }

    .diagnostics {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      font-size: 14px;
    }

    #libraryStatus {
      margin-top: 12px;
      font-weight: bold;
    }

    .test-button {
      margin-top: 15px;
      padding: 12px 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: white;
      font-weight: bold;
      font-size: 15px;
    }

  </style>
</head>


<body>

  <div class="card">

    <h1>🏆 Student Rewards</h1>

    <div class="subtitle">
      Sporting Event Check-In
    </div>


    <button
      id="scanButton"
      class="scan-button"
      type="button">
      📷 SCAN STUDENT BADGE
    </button>


    <div class="instructions">
      Tap the button and allow camera access.
      Then point the back camera at the barcode
      on the student's ID badge.
    </div>


    <div id="reader"></div>


    <div id="status"></div>


    <div class="diagnostics">

      <strong>Scanner Status</strong>

      <div id="libraryStatus">
        Checking...
      </div>

      <button
        id="testButton"
        class="test-button"
        type="button">
        TEST BUTTON
      </button>

    </div>

  </div>


<script>

let scanner = null;
let scanLocked = false;


/* -----------------------------
   WHEN PAGE LOADS
----------------------------- */

window.addEventListener("load", function () {

  document
    .getElementById("scanButton")
    .addEventListener("click", startScanner);


  document
    .getElementById("testButton")
    .addEventListener("click", function () {

      alert("The page JavaScript is working!");

    });


  checkScannerLibrary();

});


/* -----------------------------
   CHECK LIBRARY
----------------------------- */

function checkScannerLibrary() {

  const status =
    document.getElementById("libraryStatus");


  if (typeof Html5Qrcode === "undefined") {

    status.innerHTML =
      "❌ Barcode library did not load.";

    status.style.color =
      "#d93025";

  }

  else {

    status.innerHTML =
      "✅ Barcode library loaded.";

    status.style.color =
      "#188038";

  }

}


/* -----------------------------
   START CAMERA
----------------------------- */

async function startScanner() {

  scanLocked = false;

  const button =
    document.getElementById("scanButton");


  showStatus(
    "Preparing camera...",
    "info"
  );


  if (typeof Html5Qrcode === "undefined") {

    showStatus(
      "❌ The barcode scanner library did not load.",
      "error"
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "❌ Camera access is not available in this browser.",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.innerHTML =
    "STARTING CAMERA...";


  try {

    /*
      Ask Safari for camera permission
      directly before starting the
      barcode scanner.
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    /*
      Permission succeeded.
      Release this temporary stream.
    */

    stream
      .getTracks()
      .forEach(function (track) {

        track.stop();

      });


    showStatus(
      "✅ Camera permission granted. Starting scanner...",
      "info"
    );


    await launchBarcodeScanner();

  }

  catch (error) {

    button.disabled = false;

    button.innerHTML =
      "📷 SCAN STUDENT BADGE";


    showStatus(

      "<strong>Camera Error</strong>" +

      "<br><br>Error: " +

      escapeHtml(
        error.name || "Unknown"
      ) +

      "<br><br>" +

      escapeHtml(
        error.message || String(error)
      ),

      "error"

    );

  }

}


/* -----------------------------
   LAUNCH BARCODE SCANNER
----------------------------- */

async function launchBarcodeScanner() {

  const button =
    document.getElementById("scanButton");


  try {

    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function (
        viewfinderWidth,
        viewfinderHeight
      ) {

        let width =
          Math.floor(
            viewfinderWidth * 0.85
          );


        let height =
          Math.floor(
            width * 0.32
          );


        if (
          height >
          viewfinderHeight * 0.75
        ) {

          height =
            Math.floor(
              viewfinderHeight * 0.75
            );

        }


        return {

          width: width,

          height: height

        };

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODABAR,

        Html5QrcodeSupportedFormats.ITF

      ]

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      barcodeDetected,

      function () {

        /*
          This function fires repeatedly
          while no barcode is detected.
          We intentionally do nothing.
        */

      }

    );


    button.innerHTML =
      "📷 CAMERA ACTIVE";


    showStatus(
      "Camera active. Hold the badge barcode inside the scanning area.",
      "info"
    );

  }

  catch (error) {

    button.disabled = false;

    button.innerHTML =
      "📷 SCAN STUDENT BADGE";


    showStatus(

      "<strong>Scanner Error</strong>" +

      "<br><br>" +

      escapeHtml(
        error.message || String(error)
      ),

      "error"

    );

  }

}


/* -----------------------------
   BARCODE DETECTED
----------------------------- */

async function barcodeDetected(
  decodedText
) {

  if (scanLocked) {

    return;

  }


  scanLocked = true;


  showStatus(

    "✅ <strong>BARCODE READ!</strong>" +

    "<div class='barcode'>" +

    escapeHtml(decodedText) +

    "</div>",

    "success"

  );


  try {

    if (scanner) {

      await scanner.stop();

      scanner.clear();

    }

  }

  catch (error) {

    console.log(error);

  }


  const button =
    document.getElementById("scanButton");


  button.disabled = false;

  button.innerHTML =
    "📷 SCAN ANOTHER BADGE";

}


/* -----------------------------
   STATUS MESSAGE
----------------------------- */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById("status");


  status.className =
    type;


  status.innerHTML =
    message;

}


/* -----------------------------
   SAFELY DISPLAY TEXT
----------------------------- */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
