<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Student Rewards Scanner</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      background: white;
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin: 8px 0 22px;
      font-size: 17px;
    }

    /* PIN */

    .pin-section {
      background: #f8f9fa;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .pin-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #pin {
      width: 100%;
      padding: 15px;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    .test-button {
      background: #1a73e8;
      color: white;
    }

    /* MODE */

    #modeSection {
      display: none;
      margin-top: 20px;
    }

    .mode-title {
      font-size: 15px;
      font-weight: bold;
      color: #555;
      margin-bottom: 10px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-button {
      background: #e8eaed;
      color: #333;
      padding: 15px 8px;
      font-size: 16px;
    }

    .mode-button.active-checkin {
      background: #188038;
      color: white;
    }

    .mode-button.active-reward {
      background: #9334e6;
      color: white;
    }

    /* SCAN */

    .scan-button {
      margin-top: 16px;
      background: #188038;
      color: white;
      font-size: 20px;
    }

    .scan-button.reward-mode {
      background: #9334e6;
    }

    /* CAMERA */

    #scanner-container {
      position: relative;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      display: none;
    }

    #scanner {
      width: 100%;
      min-height: 300px;
    }

    #scanner video,
    #scanner canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    /*
      IMPORTANT:
      This is the working Code 39
      scanning guide.
    */

    .scan-guide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 42%;
      height: 16%;
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      border-top: 2px solid white;
      pointer-events: none;
      z-index: 11;
    }

    /* STATUS */

    #status {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: #eef3fd;
      border: 2px solid #4285f4;
    }

    .success {
      display: block !important;
      background: #e6f4ea;
      border: 2px solid #34a853;
    }

    .warning {
      display: block !important;
      background: #fef7e0;
      border: 2px solid #f9ab00;
    }

    .error {
      display: block !important;
      background: #fce8e6;
      border: 2px solid #d93025;
    }

    .reward-status {
      display: block !important;
      background: #f3e8fd;
      border: 2px solid #9334e6;
    }

    .student-name {
      font-size: 27px;
      font-weight: bold;
      margin-top: 10px;
    }

    .events-label {
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }

    .event-count {
      font-size: 44px;
      font-weight: bold;
      margin: 0;
    }

    .event-name {
      font-size: 15px;
      margin-bottom: 15px;
    }

    /* REWARD DISPLAY */

    .reward-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      border: 2px solid #f9ab00;
    }

    .reward-heading {
      font-size: 15px;
      font-weight: bold;
      color: #8a5a00;
      margin-bottom: 5px;
    }

    .reward-name {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0;
    }

    .reward-progress {
      font-size: 16px;
      margin-top: 8px;
    }

    .unlocked-card {
      background: #fff7d6;
      border: 3px solid #f9ab00;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .unlocked-title {
      font-size: 23px;
      font-weight: bold;
    }

    .available-card {
      background: #f3e8fd;
      border: 2px solid #9334e6;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
    }

    /* REDEMPTION */

    .redeem-card {
      background: white;
      border: 3px solid #9334e6;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .redeem-button {
      margin-top: 14px;
      background: #9334e6;
      color: white;
    }

    .redeemed-box {
      background: #e6f4ea;
      border: 3px solid #34a853;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .redeemed-title {
      font-size: 23px;
      font-weight: bold;
    }

    .tip {
      margin-top: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>🏆 Student Rewards</h1>

  <div class="subtitle">
    Sporting Event Rewards Program
  </div>


  <!-- PIN -->

  <div class="pin-section">

    <label for="pin">
      Staff Scanner PIN
    </label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter PIN"
    >

    <button
      id="testButton"
      class="test-button"
      type="button"
      onclick="testConnection()">
      TEST CONNECTION
    </button>

  </div>


  <!-- MODE -->

  <div id="modeSection">

    <div class="mode-title">
      SELECT MODE
    </div>

    <div class="mode-buttons">

      <button
        id="checkinModeButton"
        class="mode-button active-checkin"
        onclick="setMode('CHECK_IN')">
        🏟️ EVENT<br>CHECK-IN
      </button>

      <button
        id="rewardModeButton"
        class="mode-button"
        onclick="setMode('REWARD_LOOKUP')">
        🎁 REDEEM<br>REWARD
      </button>

    </div>

  </div>


  <!-- SCAN -->

  <button
    id="scanButton"
    class="scan-button"
    type="button"
    onclick="startScanner()"
    disabled>
    📷 SCAN STUDENT BADGE
  </button>


  <!-- CAMERA -->

  <div id="scanner-container">

    <div id="scanner"></div>

    <div class="scan-guide"></div>

    <div class="scan-line"></div>

  </div>


  <!-- RESULTS -->

  <div id="status"></div>


  <div class="tip" id="tip">
    Connect the scanner to begin.
  </div>

</div>


<script>

/*************************************************
 * SETTINGS
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwEz-Qr2m9_176d2xWeBSHmNnVKpAJCryw0D8Bsy9NY-kjC_O_RRNNwskb-cK8yOJ3tNw/exec";


let scannerRunning = false;

let scanLocked = false;

let connectionVerified = false;

let currentMode = "CHECK_IN";

let currentStudentId = null;


/*************************************************
 * CONNECTION TEST
 *************************************************/

async function testConnection() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    showStatus(
      "Please enter the Staff Scanner PIN.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("testButton");


  button.disabled = true;

  button.innerHTML = "TESTING...";


  showStatus(
    "Testing connection to the attendance system...",
    "info"
  );


  try {

    const result =
      await sendToServer(
        "__TEST__",
        "CHECK_IN"
      );


    if (
      result.success &&
      result.type === "CONNECTION_TEST"
    ) {

      connectionVerified = true;

      document.getElementById(
        "scanButton"
      ).disabled = false;

      document.getElementById(
        "modeSection"
      ).style.display = "block";

      button.innerHTML =
        "✓ CONNECTED";


      showStatus(
        "✅ <strong>CONNECTED!</strong><br><br>" +
        "Choose a mode and scan a student badge.",
        "success"
      );


      updateTip();

    }

    else {

      connectionVerified = false;

      button.disabled = false;

      button.innerHTML =
        "TEST CONNECTION";


      showStatus(
        escapeHtml(
          result.message ||
          "Connection failed."
        ),
        "error"
      );
    }

  }

  catch (error) {

    connectionVerified = false;

    button.disabled = false;

    button.innerHTML =
      "TEST CONNECTION";


    showStatus(
      "<strong>Connection Error</strong><br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),
      "error"
    );
  }
}


/*************************************************
 * MODE
 *************************************************/

function setMode(mode) {

  currentMode = mode;

  currentStudentId = null;


  const checkinButton =
    document.getElementById(
      "checkinModeButton"
    );

  const rewardButton =
    document.getElementById(
      "rewardModeButton"
    );

  const scanButton =
    document.getElementById(
      "scanButton"
    );


  if (
    mode === "CHECK_IN"
  ) {

    checkinButton.className =
      "mode-button active-checkin";

    rewardButton.className =
      "mode-button";

    scanButton.className =
      "scan-button";

    scanButton.innerHTML =
      "📷 SCAN STUDENT BADGE";

  }

  else {

    checkinButton.className =
      "mode-button";

    rewardButton.className =
      "mode-button active-reward";

    scanButton.className =
      "scan-button reward-mode";

    scanButton.innerHTML =
      "🎁 SCAN BADGE FOR REWARDS";

  }


  scanButton.disabled =
    !connectionVerified;


  clearStatus();

  updateTip();
}


/*************************************************
 * TIP
 *************************************************/

function updateTip() {

  const tip =
    document.getElementById("tip");


  if (
    currentMode === "CHECK_IN"
  ) {

    tip.innerHTML =
      "🏟️ <strong>Event Check-In Mode</strong>" +
      "<br>" +
      "Scanning records attendance for the active event.";

  }

  else {

    tip.innerHTML =
      "🎁 <strong>Reward Redemption Mode</strong>" +
      "<br>" +
      "Scanning only looks up rewards. It does NOT record attendance.";
  }
}


/*************************************************
 * SEND TO APPS SCRIPT
 *************************************************/

async function sendToServer(
  studentId,
  action,
  rewardLevel = ""
) {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const response =
    await fetch(

      API_URL,

      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            studentId:
              studentId,

            pin:
              pin,

            action:
              action,

            rewardLevel:
              rewardLevel

          }),

        redirect:
          "follow"

      }

    );


  const text =
    await response.text();


  try {

    return JSON.parse(text);

  }

  catch (error) {

    throw new Error(
      "The rewards server returned an unexpected response."
    );
  }
}


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  if (!connectionVerified) {

    showStatus(
      "Please test the connection before scanning.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "scanButton"
    );


  const container =
    document.getElementById(
      "scanner-container"
    );


  scanLocked = false;


  button.disabled = true;

  button.innerHTML =
    "STARTING CAMERA...";


  container.style.display =
    "block";


  showStatus(
    "Starting camera...",
    "info"
  );


  if (
    typeof Quagga === "undefined"
  ) {

    showStatus(
      "Quagga barcode library did not load.",
      "error"
    );

    button.disabled = false;

    resetScanButton();

    return;
  }


  /*************************************************
   * WORKING CODE 39 CONFIGURATION
   *
   * DO NOT CHANGE.
   *************************************************/

  Quagga.init({

    inputStream: {

      name:
        "Live",

      type:
        "LiveStream",

      target:
        document.querySelector(
          "#scanner"
        ),

      constraints: {

        facingMode:
          "environment",

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      },

      area: {

        top:
          "38%",

        right:
          "5%",

        left:
          "5%",

        bottom:
          "38%"

      }

    },


    locator: {

      patchSize:
        "medium",

      halfSample:
        false

    },


    locate:
      true,


    frequency:
      10,


    decoder: {

      readers: [
        "code_39_reader"
      ],

      multiple:
        false

    }

  },


  function(error) {

    if (error) {

      console.error(error);

      showStatus(
        "<strong>Scanner Error</strong><br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );

      button.disabled = false;

      resetScanButton();

      return;
    }


    Quagga.start();

    scannerRunning = true;


    button.innerHTML =
      "📷 CAMERA ACTIVE";


    showStatus(
      "Camera active. Place the entire barcode inside the white rectangle.",
      "info"
    );
  });
}


/*************************************************
 * BARCODE DETECTED
 *************************************************/

Quagga.onDetected(
  async function(data) {


    if (scanLocked) {
      return;
    }


    if (
      !data ||
      !data.codeResult ||
      !data.codeResult.code
    ) {
      return;
    }


    const code =
      String(
        data.codeResult.code
      ).trim();


    if (
      !/^\d{6}$/.test(code)
    ) {
      return;
    }


    scanLocked = true;

    currentStudentId = code;


    stopScanner();


    if (
      currentMode === "CHECK_IN"
    ) {

      showStatus(
        "✅ Badge read: <strong>" +
        escapeHtml(code) +
        "</strong><br><br>" +
        "Recording attendance...",
        "info"
      );

    }

    else {

      showStatus(
        "🎁 Badge read: <strong>" +
        escapeHtml(code) +
        "</strong><br><br>" +
        "Looking up rewards...",
        "info"
      );
    }


    try {

      const result =
        await sendToServer(
          code,
          currentMode
        );


      if (
        currentMode === "CHECK_IN"
      ) {

        displayCheckInResult(
          result
        );

      }

      else {

        displayRewardLookup(
          result
        );
      }

    }

    catch (error) {

      showStatus(
        "<strong>System Error</strong><br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        ),
        "error"
      );
    }


    const button =
      document.getElementById(
        "scanButton"
      );


    button.disabled = false;

    resetScanButton();
  }
);


/*************************************************
 * CHECK-IN RESULT
 *************************************************/

function displayCheckInResult(
  result
) {

  if (
    result.success &&
    result.type === "CHECKED_IN"
  ) {

    let html =

      "✅ <strong>CHECKED IN!</strong>" +

      "<div class='student-name'>" +
      escapeHtml(
        result.studentName
      ) +
      "</div>" +

      "<div class='events-label'>" +
      "EVENTS ATTENDED" +
      "</div>" +

      "<div class='event-count'>" +
      escapeHtml(
        result.totalEvents
      ) +
      "</div>" +

      "<div class='event-name'>" +
      escapeHtml(
        result.event
      ) +
      "</div>";


    html +=
      buildRewardDisplay(
        result.rewards
      );


    showStatus(
      html,
      "success"
    );

    return;
  }


  if (
    result.type === "DUPLICATE"
  ) {

    let html =

      "⚠️ <strong>ALREADY CHECKED IN</strong>" +

      "<div class='student-name'>" +
      escapeHtml(
        result.studentName || ""
      ) +
      "</div>" +

      "<br>" +

      escapeHtml(
        result.message || ""
      );


    html +=
      buildRewardDisplay(
        result.rewards
      );


    showStatus(
      html,
      "warning"
    );

    return;
  }


  showStatus(
    "<strong>Unable to Check In</strong>" +
    "<br><br>" +
    escapeHtml(
      result.message ||
      "Unknown error."
    ),
    "error"
  );
}


/*************************************************
 * REWARD LOOKUP RESULT
 *************************************************/

function displayRewardLookup(
  result
) {

  if (
    !result.success ||
    result.type !== "REWARD_LOOKUP"
  ) {

    showStatus(
      "<strong>Unable to Find Rewards</strong>" +
      "<br><br>" +
      escapeHtml(
        result.message ||
        "Unknown error."
      ),
      "error"
    );

    return;
  }


  let html =

    "🎁 <strong>REWARD REDEMPTION</strong>" +

    "<div class='student-name'>" +
    escapeHtml(
      result.studentName
    ) +
    "</div>" +

    "<div class='events-label'>" +
    "EVENTS ATTENDED" +
    "</div>" +

    "<div class='event-count'>" +
    escapeHtml(
      result.totalEvents
    ) +
    "</div>";


  const available =
    result.rewards &&
    result.rewards.availableRewards
      ? result.rewards.availableRewards
      : [];


  if (
    available.length === 0
  ) {

    html +=

      "<div class='available-card'>" +

      "<strong>No rewards currently available to redeem.</strong>" +

      "</div>";


    if (
      result.rewards &&
      result.rewards.nextReward
    ) {

      html +=
        buildNextReward(
          result.rewards.nextReward
        );
    }


    showStatus(
      html,
      "reward-status"
    );

    return;
  }


  available.forEach(
    function(reward) {

      html +=

        "<div class='redeem-card'>" +

        "<div class='reward-heading'>" +
        "AVAILABLE REWARD" +
        "</div>" +

        "<div class='reward-name'>" +
        escapeHtml(
          reward.reward
        ) +
        "</div>" +

        "<div>" +
        escapeHtml(
          reward.level
        ) +
        " • " +
        escapeHtml(
          reward.eventsRequired
        ) +
        " Events" +
        "</div>" +

        "<button " +
        "class='redeem-button' " +
        "onclick='confirmRedemption(" +
        JSON.stringify(
          reward.level
        ) +
        "," +
        JSON.stringify(
          reward.reward
        ) +
        ")'>" +
        "🎁 REDEEM REWARD" +
        "</button>" +

        "</div>";
    }
  );


  if (
    result.rewards.nextReward
  ) {

    html +=
      buildNextReward(
        result.rewards.nextReward
      );
  }


  showStatus(
    html,
    "reward-status"
  );
}


/*************************************************
 * CONFIRM REDEMPTION
 *************************************************/

function confirmRedemption(
  rewardLevel,
  rewardName
) {

  const confirmed =
    window.confirm(
      "Redeem this reward?\n\n" +
      rewardName +
      "\n\n" +
      "Only confirm after the reward has been given to the student."
    );


  if (!confirmed) {
    return;
  }


  redeemReward(
    rewardLevel
  );
}


/*************************************************
 * REDEEM
 *************************************************/

async function redeemReward(
  rewardLevel
) {

  if (!currentStudentId) {

    showStatus(
      "Please scan the student's badge again.",
      "error"
    );

    return;
  }


  showStatus(
    "🎁 Recording reward redemption...",
    "info"
  );


  try {

    const result =
      await sendToServer(
        currentStudentId,
        "REDEEM_REWARD",
        rewardLevel
      );


    if (
      result.success &&
      result.type === "REWARD_REDEEMED"
    ) {

      let html =

        "<div class='redeemed-box'>" +

        "<div class='redeemed-title'>" +
        "✅ REWARD REDEEMED!" +
        "</div>" +

        "<div class='student-name'>" +
        escapeHtml(
          result.studentName
        ) +
        "</div>" +

        "<div class='reward-name'>" +
        "🎁 " +
        escapeHtml(
          result.reward
        ) +
        "</div>" +

        "<div>" +
        "Redemption recorded successfully." +
        "</div>" +

        "</div>";


      if (
        result.rewards &&
        result.rewards.nextReward
      ) {

        html +=
          buildNextReward(
            result.rewards.nextReward
          );
      }


      showStatus(
        html,
        "success"
      );


      currentStudentId = null;

      return;
    }


    if (
      result.type ===
      "ALREADY_REDEEMED"
    ) {

      showStatus(
        "⚠️ <strong>ALREADY REDEEMED</strong>" +
        "<br><br>" +
        escapeHtml(
          result.reward || ""
        ) +
        "<br>" +
        escapeHtml(
          result.message || ""
        ),
        "warning"
      );

      return;
    }


    showStatus(
      "<strong>Unable to Redeem Reward</strong>" +
      "<br><br>" +
      escapeHtml(
        result.message ||
        "Unknown error."
      ),
      "error"
    );

  }

  catch (error) {

    showStatus(
      "<strong>Redemption Error</strong>" +
      "<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ),
      "error"
    );
  }
}


/*************************************************
 * REWARD PROGRESS FOR CHECK-IN
 *************************************************/

function buildRewardDisplay(
  rewards
) {

  if (!rewards) {
    return "";
  }


  let html = "";


  if (
    rewards.justUnlocked &&
    !rewards.justUnlocked.redeemed
  ) {

    html +=

      "<div class='unlocked-card'>" +

      "<div class='unlocked-title'>" +
      "🎉 REWARD UNLOCKED!" +
      "</div>" +

      "<div class='reward-name'>" +
      escapeHtml(
        rewards.justUnlocked.reward
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        rewards.justUnlocked.level
      ) +
      " • " +
      escapeHtml(
        rewards.justUnlocked.eventsRequired
      ) +
      " Events" +
      "</div>" +

      "<div class='reward-progress'>" +
      "Available to Redeem" +
      "</div>" +

      "</div>";
  }


  if (
    rewards.availableCount > 0
  ) {

    html +=

      "<div class='available-card'>" +

      "<strong>🎁 " +

      escapeHtml(
        rewards.availableCount
      ) +

      (
        rewards.availableCount === 1
          ? " Reward Available"
          : " Rewards Available"
      ) +

      "</strong>" +

      "<br>" +

      "Not yet redeemed" +

      "</div>";
  }


  if (
    rewards.nextReward
  ) {

    html +=
      buildNextReward(
        rewards.nextReward
      );
  }


  else if (
    rewards.allRewardsEarned
  ) {

    html +=

      "<div class='reward-card'>" +

      "<div class='reward-heading'>" +
      "🏆 ALL REWARD LEVELS EARNED" +
      "</div>" +

      "</div>";
  }


  return html;
}


/*************************************************
 * NEXT REWARD
 *************************************************/

function buildNextReward(
  reward
) {

  const remaining =
    reward.eventsRemaining;


  return (

    "<div class='reward-card'>" +

    "<div class='reward-heading'>" +
    "🎁 NEXT REWARD" +
    "</div>" +

    "<div class='reward-name'>" +
    escapeHtml(
      reward.reward
    ) +
    "</div>" +

    "<div>" +
    escapeHtml(
      reward.level
    ) +
    " • " +
    escapeHtml(
      reward.eventsRequired
    ) +
    " Events" +
    "</div>" +

    "<div class='reward-progress'>" +

    (
      remaining === 1
        ? "<strong>1 more event to go!</strong>"
        : "<strong>" +
          escapeHtml(remaining) +
          " more events to go!</strong>"
    ) +

    "</div>" +

    "</div>"

  );
}


/*************************************************
 * RESET SCAN BUTTON
 *************************************************/

function resetScanButton() {

  const button =
    document.getElementById(
      "scanButton"
    );


  if (
    currentMode === "CHECK_IN"
  ) {

    button.innerHTML =
      "📷 SCAN NEXT STUDENT";

  }

  else {

    button.innerHTML =
      "🎁 SCAN BADGE FOR REWARDS";
  }
}


/*************************************************
 * STOP SCANNER
 *************************************************/

function stopScanner() {

  if (scannerRunning) {

    Quagga.stop();

    scannerRunning = false;
  }


  document
    .getElementById(
      "scanner-container"
    )
    .style.display = "none";
}


/*************************************************
 * STATUS
 *************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    type;


  status.innerHTML =
    message;
}


function clearStatus() {

  const status =
    document.getElementById(
      "status"
    );


  status.className = "";

  status.innerHTML = "";

  status.style.display = "none";
}


/*************************************************
 * SAFE DISPLAY
 *************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}

</script>
